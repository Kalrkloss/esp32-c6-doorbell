<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">ESP32-C6 Super Mini with a doorbell button on GPIO2</title>
  <desc id="desc">Flat illustration of an ESP32-C6 Super Mini board and a wiring diagram: push button between GPIO2 and GND.</desc>

  <rect width="1200" height="790" rx="24" fill="#f6f7f9"/>

  <!-- ======================= board ======================= -->
  <rect x="70" y="95" width="520" height="395" rx="20" fill="#16241d" stroke="#2b4438" stroke-width="2"/>

  <g fill="#d9a441">
    <rect x="70" y="135" width="26" height="16" rx="4"/>
    <rect x="70" y="171" width="26" height="16" rx="4"/>
    <rect x="70" y="207" width="26" height="16" rx="4"/>
    <rect x="70" y="243" width="26" height="16" rx="4"/>
    <rect x="70" y="279" width="26" height="16" rx="4"/>
    <rect x="70" y="315" width="26" height="16" rx="4"/>
    <rect x="70" y="351" width="26" height="16" rx="4"/>
    <rect x="70" y="387" width="26" height="16" rx="4"/>
    <rect x="70" y="423" width="26" height="16" rx="4"/>
    <rect x="564" y="135" width="26" height="16" rx="4"/>
    <rect x="564" y="171" width="26" height="16" rx="4"/>
    <rect x="564" y="207" width="26" height="16" rx="4"/>
    <rect x="564" y="243" width="26" height="16" rx="4"/>
    <rect x="564" y="279" width="26" height="16" rx="4"/>
    <rect x="564" y="315" width="26" height="16" rx="4"/>
    <rect x="564" y="351" width="26" height="16" rx="4"/>
    <rect x="564" y="387" width="26" height="16" rx="4"/>
    <rect x="564" y="423" width="26" height="16" rx="4"/>
  </g>

  <!-- shield can -->
  <rect x="120" y="145" width="330" height="215" rx="10" fill="#cbd1d8" stroke="#98a0a9" stroke-width="2"/>
  <text x="285" y="237" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#3c454f" text-anchor="middle">ESP32-C6</text>
  <text x="285" y="269" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#5a636d" text-anchor="middle">Super Mini</text>

  <!-- antenna -->
  <g stroke="#d9a441" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M470 170 h44 v18 h-44 v18 h44 v18 h-44 v18 h44 v18 h-44"/>
  </g>

  <!-- BOOT button (GPIO9) -->
  <rect x="150" y="372" width="44" height="44" rx="8" fill="#202f27" stroke="#3d5a4b" stroke-width="2"/>
  <circle cx="172" cy="394" r="12" fill="#8d969f"/>
  <text x="172" y="440" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9fb3a8" text-anchor="middle">BOOT</text>
  <text x="172" y="458" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7f948a" text-anchor="middle">GPIO9</text>

  <!-- RESET button -->
  <rect x="212" y="372" width="44" height="44" rx="8" fill="#202f27" stroke="#3d5a4b" stroke-width="2"/>
  <circle cx="234" cy="394" r="12" fill="#8d969f"/>
  <text x="234" y="440" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9fb3a8" text-anchor="middle">RESET</text>

  <!-- power led -->
  <circle cx="500" cy="392" r="6" fill="#57d68a"/>
  <text x="500" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#9fb3a8" text-anchor="middle">PWR</text>

  <!-- USB-C -->
  <rect x="300" y="452" width="116" height="28" rx="13" fill="#c2c8d0" stroke="#8f979f" stroke-width="2"/>
  <rect x="314" y="461" width="88" height="10" rx="5" fill="#7d858d"/>

  <text x="70" y="80" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d2530">ESP32-C6 Super Mini</text>

  <!-- ======================= wiring diagram ======================= -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="680" y="80" font-size="20" font-weight="700" fill="#1d2530">Doorbell contact on GPIO2</text>
    <text x="680" y="110" font-size="16" fill="#4b5561">Push button between an LP-capable pin and GND.</text>

    <!-- wire: GPIO2 pad to switch terminal -->
    <g stroke="#2f3a46" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M596 300 h96"/>
      <path d="M760 300 h60 v86"/>
    </g>
    <circle cx="596" cy="300" r="7" fill="#d9a441"/>
    <circle cx="692" cy="300" r="6" fill="#2f3a46"/>
    <circle cx="760" cy="300" r="6" fill="#2f3a46"/>

    <!-- push button symbol: moving contact bar + plunger -->
    <g stroke="#2f3a46" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M686 284 h80"/>
      <path d="M726 284 v-24"/>
      <path d="M714 260 h24"/>
    </g>

    <!-- ground symbol -->
    <g stroke="#2f3a46" stroke-width="4" stroke-linecap="round">
      <path d="M800 386 h40"/>
      <path d="M808 400 h24"/>
      <path d="M816 414 h8"/>
    </g>

    <text x="600" y="276" font-size="17" font-weight="700" fill="#1d2530">GPIO2</text>
    <text x="600" y="332" font-size="15" fill="#6b7581">EXT1 wake-up, active low</text>
    <text x="600" y="354" font-size="15" fill="#6b7581">internal RTC pull-up</text>
    <text x="726" y="228" font-size="15" fill="#4b5561" text-anchor="middle">push</text>
    <text x="820" y="446" font-size="16" fill="#4b5561" text-anchor="middle">GND</text>

    <g font-size="16" fill="#4b5561">
      <text x="680" y="510">- Only GPIO0 to GPIO7 can wake the ESP32-C6 from deep sleep.</text>
      <text x="680" y="540">- The on-board BOOT button sits on GPIO9: a strapping pin that</text>
      <text x="690" y="564">rejects EXT1 wake-up, so the contact needs its own LP pin.</text>
      <text x="680" y="594">- Long leads: 10 kOhm to 3V3 plus 100 nF to GND at the board,</text>
      <text x="690" y="618">otherwise noise wakes the device.</text>
      <text x="680" y="648">- A press reports MultistateInput.PresentValue 1, then 0 after</text>
      <text x="690" y="672">release; Zigbee2MQTT publishes action = single.</text>
    </g>
  </g>

  <text x="70" y="746" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8a929c">
    Illustration (flat drawing, not a photo) - replace with your own picture of the board and the button.
  </text>
</svg>
